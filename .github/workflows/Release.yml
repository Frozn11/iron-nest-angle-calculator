name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
          - rid: win-x86
          - rid: linux-x64
          - rid: osx-x64
          - rid: osx-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish standalone (self-contained)
        run: |
          dotnet publish Iron_nest_angle_calculator/IronNestAngleCalculator.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PublishSingleFile=true \
            -o publish/standalone-${{ matrix.rid }}

      - name: Publish framework-dependent
        run: |
          dotnet publish Iron_nest_angle_calculator/IronNestAngleCalculator.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/framework-dependent-${{ matrix.rid }}

      - name: Zip standalone build
        run: |
          mv publish/standalone-${{ matrix.rid }} IronNestCalc-${{ matrix.rid }}-Standalone
          zip -r IronNestCalc-${{ matrix.rid }}-standalone.zip IronNestCalc-${{ matrix.rid }}-Standalone

      - name: Zip framework-dependent build
        run: |
          mv publish/framework-dependent-${{ matrix.rid }} IronNestCalc-${{ matrix.rid }}-Framework
          zip -r IronNestCalc-${{ matrix.rid }}-framework-dependent.zip IronNestCalc-${{ matrix.rid }}-Framework

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.rid }}
          path: |
            IronNestCalc-${{ matrix.rid }}-standalone.zip
            IronNestCalc-${{ matrix.rid }}-framework-dependent.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true