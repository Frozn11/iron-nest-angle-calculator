name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
          - rid: win-x86
          - rid: linux-x64
          - rid: osx-x64
          - rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish standalone (self-contained)
        run: |
          dotnet publish \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PublishSingleFile=true \
            -o publish/standalone-${{ matrix.rid }}

      - name: Publish framework-dependent
        run: |
          dotnet publish \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/framework-dependent-${{ matrix.rid }}

      - name: Zip standalone build
        run: |
          cd publish/standalone-${{ matrix.rid }}
          zip -r ../../IronNestCalc-${{ matrix.rid }}-standalone.zip .
          cd -

      - name: Zip framework-dependent build
        run: |
          cd publish/framework-dependent-${{ matrix.rid }}
          zip -r ../../IronNestCalc-${{ matrix.rid }}-framework-dependent.zip .
          cd -

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: |
            IronNestCalc-${{ matrix.rid }}-standalone.zip
            IronNestCalc-${{ matrix.rid }}-framework-dependent.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true